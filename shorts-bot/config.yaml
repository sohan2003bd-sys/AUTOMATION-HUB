# ====== সাধারণ ======
channel:
  handle: ""                   # ভিডিওর নিচে ওয়াটারমার্ক (যেমন "@mychannel"); ফাঁকা = পর্দায় শুধু সাবটাইটেল

llm:
  provider: gemini             # anthropic | gemini
  anthropic_model: claude-haiku-5-5
  gemini_model: gemini-3.5-flash-lite            # স্ক্রিপ্টের জন্য (মান ভালো, ফ্রি সীমা কম)
  gemini_fallback_model: gemini-3.1-flash-lite   # স্ক্রিপ্টের মডেলে কোটা/সমস্যা হলে এটা দিয়ে চেষ্টা (ফাঁকা রাখলে বন্ধ)
  gemini_idea_model: gemini-3.5-flash-lite  # আইডিয়ার জন্য আলাদা মডেল (ফ্রি সীমা বেশি); ফাঁকা রাখলে স্ক্রিপ্টের মডেলই চলবে
  gemini_idea_fallback_model: gemini-3.1-flash-lite
  gemini_thinking: low                         # low (কম টোকেন, দ্রুত) | medium | high — Gemini 3.x-এর চিন্তার স্তর
  # কী (key) এনভায়রনমেন্টে রাখুন: ANTHROPIC_API_KEY অথবা GEMINI_API_KEY
  # Gemini-র ৫টি কী দিতে পারেন: GEMINI_API_KEY, GEMINI_API_KEY_2 … GEMINI_API_KEY_5 — একটার কোটা শেষ হলে পরেরটা, গোল ঘুরে

# ---- গবেষণা ও ফ্যাক্ট-চেক (শুধু provider: gemini-তে; গুগল সার্চ দিয়ে তথ্য যাচাই) ----
research:
  enabled: true                 # স্ক্রিপ্ট লেখার আগে গুগল সার্চে তথ্য জোগাড়; গুজব/ভুল/পুরনো বিষয় বাতিল (ভাইরাল টপিকে এটা জরুরি)
  verify: false                 # (টোকেন বাঁচাতে বন্ধ; true করলে প্রতি ভিডিওতে ১টি বাড়তি কল) # স্ক্রিপ্ট লেখার পর প্রতিটি দাবি আবার মিলিয়ে দেখা, ভুল থাকলে ঠিক করা
  strict: false                # true হলে গবেষণা/যাচাই ব্যর্থ হলে ভিডিও বানানো বন্ধ; false হলে বাদ দিয়ে চলে

# ---- আসল ফুটেজ ও ছবি (PEXELS / PIXABAY / UNSPLASH কী — যেকোনো একটা হলেই চলে; Lorem Picsum কী ছাড়াই শেষ ভরসা; কিছুই না থাকলে ডিজাইন-ব্যাকগ্রাউন্ড) ----
media:
  enabled: true
  prefer: video                # video (প্রথমে ফুটেজ, না মিললে ছবি) | photo
  min_clip_seconds: 3
  picsum_fallback: false       # true = সব স্টক সাইটে না মিললে Lorem Picsum-এর এলোমেলো ছবি (কিওয়ার্ড মেলে না, তাই ডিফল্ট বন্ধ)

tts:
  engine: edge                 # edge (বিনামূল্যের Microsoft Edge বাংলা ভয়েস) | silent (শুধু পরীক্ষা)
  voice: bn-BD-NabanitaNeural  # voices তালিকা থাকলে এটা শুধু শেষ ভরসা
  rate: "+4%"                  # সবার জন্য ভিত্তি গতি; প্রতি ভিডিওতে tone ও এলোমেলো ওঠানামা যোগ হয়
  pitch: "+0Hz"
  alternate_gender: true       # true = পরপর ভিডিওতে নারী ↔ পুরুষ কণ্ঠ ঘুরে ঘুরে (দিনে ২টিতে একটা নারী, একটা পুরুষ)
  jitter: true                 # প্রতি ভিডিওতে গতি/পিচে সামান্য এলোমেলো পরিবর্তন, যাতে সব ভিডিও একই ছাঁচের না শোনায়
  # একটা ভিডিওর সব দৃশ্য একই কণ্ঠে হয়। weight বেশি = বেশি বার বাছা হবে।
  voices:
    - {name: bn-BD-NabanitaNeural, gender: female, weight: 3}   # বাংলাদেশি নারী
    - {name: bn-BD-PradeepNeural,  gender: male,   weight: 3}   # বাংলাদেশি পুরুষ
    - {name: bn-IN-TanishaaNeural, gender: female, weight: 1}   # কলকাতার টানের নারী (বৈচিত্র্যের জন্য; না চাইলে মুছে দিন)
    - {name: bn-IN-BashkarNeural,  gender: male,   weight: 1}   # কলকাতার টানের পুরুষ (না চাইলে মুছে দিন)

audio:
  music_dir: assets/music      # কপিরাইট-মুক্ত গান (mp3/wav) এখানে রাখুন; ফাঁকা থাকলে মিউজিক ছাড়া
  music_volume: 0.16           # ভয়েস চললে নিজে আরও নিচু হয়ে যায় (ডাকিং)
  sfx: true                    # দৃশ্য বদলের হালকা 'হুশ' সাউন্ড
  sfx_volume: 0.4

video:
  quality: high                # high = ১০৮০×১৯২০ (Shorts-এর মান, দ্রুত) | ultra = ১৪৪০×২৫৬০ (বেশি বিটরেট, ধীর) | draft = দ্রুত পরীক্ষা
  width: 1080
  height: 1920
  fps: 30
  transition: 0.35             # দৃশ্য বদলের ট্রানজিশনের সময় (সেকেন্ড); 0 = সরাসরি কাট
  scene_pad: 0.45              # প্রতি দৃশ্যের কথার পর বিরতি (সেকেন্ড)
  style: subtitles             # subtitles = পর্দায় শুধু বাংলা সাবটাইটেল (কোনো হেডলাইন/চিপ/বার নেই) | classic = আগের হেডলাইনসহ ডিজাইন
  captions: true               # কথার সঙ্গে সঙ্গে বাংলা সাবটাইটেল
  caption_words: 4             # এক সাবটাইটেলে সর্বোচ্চ শব্দ
  looks: true                  # প্রতি ভিডিওর আলাদা রঙের ছোঁয়া/গ্রেইন/ভিগনেট — ফুটেজ আসল ক্যামেরার মতো ও প্রতিটি ভিডিও আলাদা দেখায়
  motion: zoom
  font: ""                     # বাংলা ফন্টের পাথ। ফাঁকা থাকলে নিজে খুঁজে নেবে (Noto Sans Bengali)

# ---- নিজের ভিডিও স্মার্ট এডিট (python -m shorts edit ফাইল.mp4) ----
smartedit:
  silence_db: -34              # এর চেয়ে নিচু শব্দ = নীরবতা
  min_silence: 0.45            # এর চেয়ে লম্বা নীরবতা কাটা হবে (সেকেন্ড)
  keep_padding: 0.12           # কথার আগে-পরে এটুকু রেখে কাটা হবে
  reframe: blur                # blur = পুরো ফ্রেম রেখে ঝাপসা পটভূমি | crop = মাঝখান থেকে ৯:১৬ কেটে নেওয়া
  captions: true               # Gemini দিয়ে বাংলা/ইংরেজি ক্যাপশন (provider: gemini লাগবে)
  loudnorm: true

# ---- সীমা: মাসে সর্বোচ্চ এতগুলো ভিডিও আপলোড (দিনে ২টি × ৩০ = ৬০); ১০ ক্যাটাগরি ঘুরিয়ে ঘুরিয়ে, প্রতিটি থেকে ~৬টি ----
limits:
  monthly_max: 60              # 0 = সীমা নেই

script:
  target_seconds: 40       # প্রতি ভিডিওর লক্ষ্য দৈর্ঘ্য (বাংলা ভয়েসে প্রায় ২ শব্দ/সেকেন্ড)
  min_words: 65
  max_words: 100
  max_retries: 2

upload:
  privacy: private             # private (শুরুতে নিরাপদ) | public | unlisted | schedule
  category_id: "22"            # 22 = People & Blogs (মিশ্র বিষয়ের জন্য নিরাপদ); খবর-ঘেঁষা হলে 25, শিক্ষামূলক হলে 27
  language: bn
  notify_subscribers: false    # ১০টি করে আপলোডে সাবস্ক্রাইবারকে বারবার নোটিফিকেশন না পাঠাতে
  timezone_offset_hours: 6     # বাংলাদেশ = +6
  slots: ["13:00", "20:00"]   # schedule মোডে প্রকাশের সময় (দিনে ২টি)

paths:
  data_dir: data
  out_dir: output

# ---- আইডিয়া: আজকের ভাইরাল ও জানা-দরকার বিষয় (গুগল সার্চ দিয়ে খুঁজে) ----
ideas:
  trending: true               # true = প্রতিদিন গুগল সার্চে বাংলাদেশ ও বিশ্বের আজকের আলোচিত বিষয় খুঁজে আইডিয়া বানায় (provider: gemini লাগবে)
  max_age_days: 2              # এত দিনের পুরনো (আলোচিত) আইডিয়া ফেলে দেওয়া হয়, যাতে ভিডিও সবসময় টাটকা থাকে
  country: Bangladesh          # কোন দেশের দর্শকের জন্য আলোচিত বিষয় বাছা হবে

# ====== ক্যাটাগরি: ভাইরাল ও মানুষের জানা দরকার এমন বিষয় ======
# evergreen: true = আইডিয়া পুরনো হয় না (স্বাস্থ্য, টাকা-পয়সা ইত্যাদি); false = শুধু টাটকা আলোচনার বিষয়
categories:
  - {id: trending,   name: "আজকের আলোচিত",          accent: "#EF4444", evergreen: false, stock: "news city people",   hint: "আজ বাংলাদেশ ও বিশ্বে যে বিষয়গুলো সবচেয়ে বেশি আলোচিত ও মানুষ জানতে চাইছে (নির্ভরযোগ্য সূত্রে নিশ্চিত খবর, গুজব নয়)"}
  - {id: health,     name: "স্বাস্থ্য ও সতর্কতা",     accent: "#10B981", evergreen: true,  stock: "doctor hospital",   hint: "এখন আলোচিত রোগ-ব্যাধি, মৌসুমি অসুখ, খাবার ও জীবনযাপনের এমন তথ্য যা সবার জানা দরকার (চিকিৎসা-পরামর্শ নয়, সচেতনতা)"}
  - {id: money,      name: "টাকা-পয়সা",              accent: "#F59E0B", evergreen: false, stock: "money bank market", hint: "দ্রব্যমূল্য, ডলার-সোনার দাম, ব্যাংক, সঞ্চয়, ট্যাক্স, মোবাইল ব্যাংকিং—যা সাধারণ মানুষের পকেটে প্রভাব ফেলে"}
  - {id: scam,       name: "প্রতারণা থেকে সাবধান",     accent: "#DC2626", evergreen: false, stock: "phone call worried", hint: "এখন যে প্রতারণা, স্ক্যাম ও ভুয়া খবর ছড়াচ্ছে এবং কীভাবে চিনবেন ও বাঁচবেন"}
  - {id: law,        name: "আইন ও অধিকার",            accent: "#3B82F6", evergreen: true,  stock: "court law office",  hint: "নাগরিকের আইনি অধিকার, নতুন নিয়ম-নীতি, সরকারি সেবা ও কাগজপত্রের সহজ ব্যাখ্যা"}
  - {id: science,    name: "বিজ্ঞান ও বিস্ময়",        accent: "#8B5CF6", evergreen: true,  stock: "science space nature", hint: "মহাকাশ, প্রকৃতি, মানবদেহ ও নতুন আবিষ্কারের সত্য, চমকপ্রদ কিন্তু যাচাই-করা তথ্য"}
  - {id: tech,       name: "প্রযুক্তি ও AI",           accent: "#06B6D4", evergreen: false, stock: "technology smartphone", hint: "এখন আলোচিত নতুন প্রযুক্তি, AI, ফোন ও অ্যাপের খবর এবং তা সাধারণ মানুষের কী কাজে লাগে"}
  - {id: career,     name: "চাকরি ও শিক্ষা",           accent: "#F97316", evergreen: false, stock: "students office interview", hint: "চাকরির বাজার, পরীক্ষা, ভর্তি, বিদেশে পড়াশোনা-কাজের সঠিক তথ্য ও দরকারি কৌশল"}
  - {id: world,      name: "বিশ্ব ঘটনা সহজে",          accent: "#EC4899", evergreen: false, stock: "world city skyline", hint: "বিশ্বের বড় ঘটনা (যুদ্ধ, অর্থনীতি, পরিবেশ, মহামারি ইত্যাদি) বাংলাদেশির দৃষ্টিতে সহজ ভাষায়, পক্ষপাতহীনভাবে"}
  - {id: life,       name: "জীবনযাপন ও সম্পর্ক",       accent: "#14B8A6", evergreen: true,  stock: "family home lifestyle", hint: "পরিবার, সন্তান-লালন, মানসিক চাপ সামলানো, ঘরোয়া সমস্যা ও দৈনন্দিন জীবনের কাজের কৌশল"}
