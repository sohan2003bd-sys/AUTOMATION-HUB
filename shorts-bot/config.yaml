# ====== সাধারণ ======
channel:
  handle: "@your_channel"      # ভিডিওর নিচে ওয়াটারমার্ক; ফাঁকা রাখলে দেখাবে না

llm:
  provider: gemini             # anthropic | gemini
  anthropic_model: claude-haiku-5-5
  gemini_model: gemini-3.8-flash            # স্ক্রিপ্টের জন্য (মান ভালো, ফ্রি সীমা কম)
  gemini_fallback_model: gemini-3.5-flash-lite   # স্ক্রিপ্টের মডেলে কোটা/সমস্যা হলে এটা দিয়ে চেষ্টা (ফাঁকা রাখলে বন্ধ)
  gemini_idea_model: gemini-3.5-flash-lite  # আইডিয়ার জন্য আলাদা মডেল (ফ্রি সীমা বেশি); ফাঁকা রাখলে স্ক্রিপ্টের মডেলই চলবে
  gemini_idea_fallback_model: gemini-3.1-flash-lite
  gemini_thinking: low                      # low (দ্রুত) | medium | high — Gemini 3.x-এর চিন্তার স্তর
  # কী (key) এনভায়রনমেন্টে রাখুন: ANTHROPIC_API_KEY অথবা GEMINI_API_KEY

# ---- গবেষণা ও ফ্যাক্ট-চেক (শুধু provider: gemini-তে; গুগল সার্চ দিয়ে তথ্য যাচাই) ----
research:
  enabled: true                # স্ক্রিপ্ট লেখার আগে গুগল সার্চে তথ্য জোগাড়; ভুল/পুরনো বিষয় বাতিল
  verify: true                 # স্ক্রিপ্ট লেখার পর প্রতিটি দাবি আবার মিলিয়ে দেখা, ভুল থাকলে ঠিক করা
  strict: false                # true হলে গবেষণা/যাচাই ব্যর্থ হলে ভিডিও বানানো বন্ধ; false হলে বাদ দিয়ে চলে

# ---- আসল ফুটেজ ও ছবি (PEXELS_API_KEY ও/অথবা PIXABAY_API_KEY লাগবে; না থাকলে ডিজাইন-ব্যাকগ্রাউন্ড) ----
media:
  enabled: true
  prefer: video                # video (প্রথমে ফুটেজ, না মিললে ছবি) | photo
  min_clip_seconds: 3

tts:
  engine: gemini               # gemini (স্বাভাবিক, আবেগময় কণ্ঠ) | edge (বিনামূল্যের বাংলা ভয়েস) | silent (শুধু পরীক্ষা)
  fallback: edge               # প্রধান engine-এ কোটা/সমস্যা হলে পুরো ভিডিও এটা দিয়ে বানানো হয়
  gemini_model: gemini-2.5-flash-preview-tts
  gemini_voice: Kore           # অন্য কণ্ঠ: Puck, Charon, Aoede, Leda, Orus, Zephyr ইত্যাদি
  gemini_style: "Say in clear, natural, friendly Bengali, like an enthusiastic tech teacher explaining a useful tip"
  voice: bn-BD-NabanitaNeural  # edge-এর কণ্ঠ। নারী: Nabanita, পুরুষ: bn-BD-PradeepNeural
  rate: "+0%"                  # edge-এর গতি, যেমন "-5%" বা "+8%"
  pitch: "+0Hz"

audio:
  music_dir: assets/music      # কপিরাইট-মুক্ত গান (mp3/wav) এখানে রাখুন; ফাঁকা থাকলে মিউজিক ছাড়া
  music_volume: 0.16           # ভয়েস চললে নিজে আরও নিচু হয়ে যায় (ডাকিং)
  sfx: true                    # দৃশ্য বদলের হালকা 'হুশ' সাউন্ড
  sfx_volume: 0.4

video:
  quality: high                # high = ১০৮০×১৯২০ (Shorts-এর মান, দ্রুত) | ultra = ১৪৪০×২৫৬০ (বেশি বিটরেট, ধীর) | draft = দ্রুত পরীক্ষা
  width: 1080
  height: 1920
  fps: 30
  transition: 0.35             # দৃশ্য বদলের ট্রানজিশনের সময় (সেকেন্ড); 0 = সরাসরি কাট
  scene_pad: 0.45              # প্রতি দৃশ্যের কথার পর বিরতি (সেকেন্ড)
  captions: true               # কথার সঙ্গে সঙ্গে ক্যাপশন
  caption_words: 4             # এক ক্যাপশনে সর্বোচ্চ শব্দ
  motion: zoom
  font: ""                     # বাংলা ফন্টের পাথ। ফাঁকা থাকলে নিজে খুঁজে নেবে (Noto Sans Bengali)

# ---- নিজের ভিডিও স্মার্ট এডিট (python -m shorts edit ফাইল.mp4) ----
smartedit:
  silence_db: -34              # এর চেয়ে নিচু শব্দ = নীরবতা
  min_silence: 0.45            # এর চেয়ে লম্বা নীরবতা কাটা হবে (সেকেন্ড)
  keep_padding: 0.12           # কথার আগে-পরে এটুকু রেখে কাটা হবে
  reframe: blur                # blur = পুরো ফ্রেম রেখে ঝাপসা পটভূমি | crop = মাঝখান থেকে ৯:১৬ কেটে নেওয়া
  captions: true               # Gemini দিয়ে বাংলা/ইংরেজি ক্যাপশন (provider: gemini লাগবে)
  loudnorm: true

script:
  target_seconds: 30       # প্রতি ভিডিওর লক্ষ্য দৈর্ঘ্য (বাংলা ভয়েসে প্রায় ২ শব্দ/সেকেন্ড)
  min_words: 55
  max_words: 85
  max_retries: 3

upload:
  privacy: private             # private (শুরুতে নিরাপদ) | public | unlisted | schedule
  category_id: "28"            # 28 = Science & Technology
  language: bn
  notify_subscribers: false    # ১০টি করে আপলোডে সাবস্ক্রাইবারকে বারবার নোটিফিকেশন না পাঠাতে
  timezone_offset_hours: 6     # বাংলাদেশ = +6
  slots: ["07:30", "09:00", "10:30", "12:00", "13:30", "15:00", "17:00", "19:00", "20:30", "22:00"]  # schedule মোডে প্রকাশের সময়

paths:
  data_dir: data
  out_dir: output

