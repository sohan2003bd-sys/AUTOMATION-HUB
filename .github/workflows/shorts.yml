name: shorts-daily

on:
  schedule:
    # বাংলাদেশ সময়ে প্রতি ২ ঘণ্টায় একটি ভিডিও। তিনটি ট্রিগার GitHub-এর বিলম্ব/মিসড রান সামলাতে retry window দেয়।
    # GitHub scheduled workflow best-effort; প্রকাশের নির্দিষ্ট সময় YouTube-এ schedule করা হয়।
    - cron: "0,10,20 0-18/2 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "কয়টি ভিডিও বানাবে"
        default: "1"
      privacy:
        description: "প্রকাশের ধরন (config = config.yaml-এর মান)"
        type: choice
        options: [config, private, public, schedule]
        default: config

concurrency:
  group: shorts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: shorts-bot
    steps:
      - uses: actions/checkout@v4

      - name: গেট — এই ২ ঘণ্টার ব্লকে ভিডিও হয়েছে কি না দেখা
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          go, why = True, "হাতে চালানো (workflow_dispatch) — গেট প্রযোজ্য নয়"
          if os.environ.get("EVENT") != "workflow_dispatch":
              block_start = now.replace(hour=now.hour // 2 * 2, minute=0, second=0, microsecond=0).timestamp()
              last = 0.0
              try:
                  for line in open("data/queue.jsonl", encoding="utf-8"):
                      line = line.strip()
                      if line:
                          up = json.loads(line).get("uploaded")
                          if up:
                              last = max(last, float(up))
              except FileNotFoundError:
                  pass
              if now.hour > 19:
                  go, why = False, f"UTC {now.hour}টা = বাংলাদেশের গভীর রাত — আজকের সময়সীমার বাইরে"
              elif last >= block_start:
                  go, why = False, "এই ২ ঘণ্টার ব্লকে ইতিমধ্যে ভিডিও আপলোড হয়েছে"
              else:
                  go, why = True, "এই ব্লকে এখনো ভিডিও হয়নি — চালানো হবে"
          msg = ("চলবে: " if go else "বাদ: ") + why
          print(f"[{now:%Y-%m-%d %H:%M} UTC | event={os.environ.get('EVENT')}] " + msg)
          try:
              with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a", encoding="utf-8") as sf:
                  sf.write(("### ✅ " if go else "### ⏭️ ") + msg + "\n")
          except OSError:
              pass
          # UTC দুই-ঘণ্টার ব্লক অনুযায়ী ১..১০ নম্বর API key slot।
          key_slot = (now.hour // 2) % 10 + 1
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("go=" + ("true" if go else "false") + "\n")
              f.write("key_slot=" + str(key_slot) + "\n")
          PY

      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: shorts-bot/requirements.txt

      - name: FFmpeg ও বাংলা ফন্ট
        if: steps.gate.outputs.go == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0

      - if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: সবকিছু ঠিক আছে কিনা দেখো (doctor)
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m shorts doctor

      - name: ভিডিও বানাও ও আপলোড করো
        if: steps.gate.outputs.go == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_KEY_SLOT: ${{ steps.gate.outputs.key_slot }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          COUNT: ${{ github.event.inputs.count || '1' }}
          PRIVACY: ${{ github.event.inputs.privacy || 'config' }}
        run: |
          ARGS=""
          if [ "$PRIVACY" != "config" ]; then ARGS="--privacy $PRIVACY"; fi
          python -m shorts run --count "$COUNT" $ARGS

      - name: অবস্থা সেভ করো (queue ও স্ক্রিপ্ট)
        if: always() && steps.gate.outputs.go == 'true'
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "সেভ করার মতো নতুন কিছু নেই"
            exit 0
          fi
          git commit -m "shorts: queue update"
          # দুটি রান কাছাকাছি হলে বা নেটওয়ার্ক আটকালে কয়েকবার চেষ্টা; না পারলে লাল হবে (যাতে চোখে পড়ে)
          for i in 1 2 3 4; do
            if git pull --rebase --autostash && git push; then
              echo "সেভ হয়েছে"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error title=সেভ ব্যর্থ::data/queue.jsonl পুশ করা যায়নি — পরের রানে একই ভিডিও আবার বানানোর ঝুঁকি। Settings → Actions → Workflow permissions = Read and write দিন।"
          exit 1
