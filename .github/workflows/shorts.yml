name: shorts-daily

on:
  schedule:
    - cron: "0 2 * * *"        # প্রতিদিন UTC ০২:০০ = বাংলাদেশ সকাল ০৮:০০
  workflow_dispatch:
    inputs:
      count:
        description: "কয়টি ভিডিও বানাবে"
        default: "1"
      privacy:
        description: "প্রকাশের ধরন (config = config.yaml-এর মান)"
        type: choice
        options: [config, private, public, schedule]
        default: config

concurrency:
  group: shorts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: shorts-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: shorts-bot/requirements.txt

      - name: FFmpeg ও বাংলা ফন্ট
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0

      - run: pip install -r requirements.txt

      - name: সবকিছু ঠিক আছে কিনা দেখো (doctor)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m shorts doctor

      - name: ভিডিও বানাও ও আপলোড করো
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COUNT: ${{ github.event.inputs.count || '10' }}
          PRIVACY: ${{ github.event.inputs.privacy || 'config' }}
        run: |
          ARGS=""
          if [ "$PRIVACY" != "config" ]; then ARGS="--privacy $PRIVACY"; fi
          python -m shorts run --count "$COUNT" $ARGS

      - name: অবস্থা সেভ করো (queue ও স্ক্রিপ্ট)
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "shorts: queue update"
            git pull --rebase
            git push
          fi
