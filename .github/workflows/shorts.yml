name: shorts-daily

on:
  schedule:
    # প্রতি ঘণ্টায় একবার "দরজা ঠকঠক" করে। নিচের "গেট" ধাপ ঠিক করে সত্যিই ভিডিও বানাবে কি না:
    # প্রতিটি ২ ঘণ্টার ব্লকে (UTC ০০-০২, ০২-০৪, …, ১৮-২০) একটি করে ভিডিও = বাংলাদেশ সকাল ০৬ থেকে দিনে ১০টি।
    # GitHub কোনো স্লট বাদ দিলে বা রান ফেল করলে পরের ঘণ্টায় একই ব্লকের মধ্যে আবার চেষ্টা হবে।
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "কয়টি ভিডিও বানাবে"
        default: "1"
      privacy:
        description: "প্রকাশের ধরন (config = config.yaml-এর মান)"
        type: choice
        options: [config, private, public, schedule]
        default: config

concurrency:
  group: shorts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: shorts-bot
    steps:
      - uses: actions/checkout@v4

      - name: গেট — এই ২ ঘণ্টার ব্লকে ভিডিও হয়েছে কি না দেখা
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          go, why = True, "হাতে চালানো (workflow_dispatch) — গেট প্রযোজ্য নয়"
          if os.environ.get("EVENT") != "workflow_dispatch":
              block_start = now.replace(hour=now.hour // 2 * 2, minute=0, second=0, microsecond=0).timestamp()
              last = 0.0
              try:
                  for line in open("data/queue.jsonl", encoding="utf-8"):
                      line = line.strip()
                      if line:
                          up = json.loads(line).get("uploaded")
                          if up:
                              last = max(last, float(up))
              except FileNotFoundError:
                  pass
              if now.hour > 19:
                  go, why = False, f"UTC {now.hour}টা = বাংলাদেশের গভীর রাত — আজকের সময়সীমার বাইরে"
              elif last >= block_start:
                  go, why = False, "এই ২ ঘণ্টার ব্লকে ইতিমধ্যে ভিডিও আপলোড হয়েছে"
              else:
                  go, why = True, "এই ব্লকে এখনো ভিডিও হয়নি — চালানো হবে"
          print(("চলবে: " if go else "বাদ: ") + why)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("go=" + ("true" if go else "false") + "\n")
          PY

      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: shorts-bot/requirements.txt

      - name: FFmpeg ও বাংলা ফন্ট
        if: steps.gate.outputs.go == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0

      - if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: সবকিছু ঠিক আছে কিনা দেখো (doctor)
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m shorts doctor

      - name: ভিডিও বানাও ও আপলোড করো
        if: steps.gate.outputs.go == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          COUNT: ${{ github.event.inputs.count || '1' }}
          PRIVACY: ${{ github.event.inputs.privacy || 'config' }}
        run: |
          ARGS=""
          if [ "$PRIVACY" != "config" ]; then ARGS="--privacy $PRIVACY"; fi
          python -m shorts run --count "$COUNT" $ARGS

      - name: অবস্থা সেভ করো (queue ও স্ক্রিপ্ট)
        if: always() && steps.gate.outputs.go == 'true'
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "shorts: queue update"
            git pull --rebase
            git push
          fi
