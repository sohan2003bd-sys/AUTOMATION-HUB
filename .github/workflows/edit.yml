name: edit-my-video

on:
  workflow_dispatch:
    inputs:
      path:
        description: "রিপোর ভেতরের ভিডিও বা ফোল্ডার (যেমন inbox/ অথবা inbox/video1.mp4)"
        default: "inbox/"
      upload:
        description: "এডিটের পর ইউটিউবে আপলোড করবে?"
        type: boolean
        default: false
      privacy:
        description: "আপলোড করলে প্রকাশের ধরন"
        type: choice
        options: [private, unlisted, public]
        default: private
      captions:
        description: "ক্যাপশন যোগ করবে? (Gemini লাগে)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: shorts-bot
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker image তৈরি (cached tools + Python packages)
        uses: docker/build-push-action@v6
        with:
          context: ./shorts-bot
          file: ./shorts-bot/Dockerfile
          tags: shorts-bot:ci
          load: true
          cache-from: type=gha,scope=shorts-bot
          cache-to: type=gha,mode=max,scope=shorts-bot

      - name: স্মার্ট এডিট
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET: ${{ github.event.inputs.path }}
          UPLOAD: ${{ github.event.inputs.upload }}
          PRIVACY: ${{ github.event.inputs.privacy }}
          CAPTIONS: ${{ github.event.inputs.captions }}
        run: |
          ARGS=""
          if [ "$UPLOAD" = "true" ]; then ARGS="$ARGS --upload --privacy $PRIVACY"; fi
          if [ "$CAPTIONS" != "true" ]; then ARGS="$ARGS --no-captions"; fi
          docker run --rm -v "$PWD:/app" -w /app --env GEMINI_API_KEY --env GEMINI_API_KEY_2 --env GEMINI_API_KEY_3 --env GEMINI_API_KEY_4 --env GEMINI_API_KEY_5 --env GEMINI_API_KEY_6 --env GEMINI_API_KEY_7 --env GEMINI_API_KEY_8 --env GEMINI_API_KEY_9 --env GEMINI_API_KEY_10 --env ANTHROPIC_API_KEY --env PEXELS_API_KEY --env PIXABAY_API_KEY --env UNSPLASH_ACCESS_KEY --env YT_CLIENT_ID --env YT_CLIENT_SECRET --env YT_REFRESH_TOKEN --env TARGET --env UPLOAD --env PRIVACY --env CAPTIONS shorts-bot:ci python -m shorts edit "$TARGET" $ARGS

      - name: এডিট করা ভিডিও নামিয়ে নিন (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edited-videos
          path: shorts-bot/output/edit-*
          retention-days: 7
